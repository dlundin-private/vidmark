<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Vidmark</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; overscroll-behavior: none; }
      /* Taps and swipes belong to the game: no page scroll, pinch zoom or double-tap zoom. */
      html, body, #game, canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
